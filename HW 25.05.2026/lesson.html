<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Modern Registration Form</title>

    <link rel="stylesheet"
          href="style.css">

</head>
<body>

    <form id="formCard"
          class="form-card">

        <h1 id="title">
            Registration Form
        </h1>

        <p id="subtitle">
            Example of a modern HTML form
        </p>


        <div class="grid">

            <div class="field">

                <label id="themeLabel">
                    Theme
                </label>

                <select id="themeSelect">

                    <option value="dark">
                        Dark
                    </option>

                    <option value="light">
                        Light
                    </option>

                </select>

            </div>


            <div class="field">

                <label id="languageLabel">
                    Language
                </label>

                <select id="languageSelect">

                    <option value="en">
                        English
                    </option>

                    <option value="ua">
                        Ukrainian
                    </option>

                </select>

            </div>

        </div>


        <div class="grid">

            <div class="field">

                <label id="firstNameLabel">
                    First Name
                </label>

                <input type="text"
                       placeholder="Enter first name">

            </div>


            <div class="field">

                <label id="lastNameLabel">
                    Last Name
                </label>

                <input type="text"
                       placeholder="Enter last name">

            </div>


            <div class="field">

                <label id="emailLabel">
                    Email
                </label>

                <input type="email"
                       placeholder="example@gmail.com">

            </div>


            <div class="field">

                <label id="passwordLabel">
                    Password
                </label>

                <input type="password"
                       placeholder="********">

            </div>


            <div class="field">

                <label id="birthLabel">
                    Birth Date
                </label>

                <input type="date">

            </div>


            <div class="field">

                <label id="phoneLabel">
                    Phone
                </label>

                <input type="tel"
                       placeholder="+380...">

            </div>


            <div class="field full">

                <label id="countryLabel">
                    Country
                </label>

                <select>

                    <option>
                        Germany
                    </option>

                    <option>
                        Ukraine
                    </option>

                    <option>
                        Poland
                    </option>

                    <option>
                        USA
                    </option>

                </select>

            </div>


            <div class="field full">

                <label id="genderLabel">
                    Gender
                </label>

                <div class="radio-group">

                    <label>

                        <input type="radio"
                               checked>

                        <span id="maleText">
                            Male
                        </span>

                    </label>


                    <label>

                        <input type="radio">

                        <span id="femaleText">
                            Female
                        </span>

                    </label>

                </div>

            </div>


            <div class="field full">

                <label id="skillsLabel">
                    Skills
                </label>

                <div class="checkbox-group">

                    <label>
                        <input type="checkbox">
                        HTML
                    </label>

                    <label>
                        <input type="checkbox">
                        CSS
                    </label>

                    <label>
                        <input type="checkbox">
                        JavaScript
                    </label>

                    <label>
                        <input type="checkbox">
                        Python
                    </label>

                </div>

            </div>


            <div class="field full">

                <label id="experienceLabel">
                    Experience Level
                </label>

                <input type="range"
                       min="0"
                       max="100"
                       value="50"
                       id="range">

                <div class="range-value"
                     id="valueText">

                    50%

                </div>

            </div>


            <div class="field full">

                <label id="fileLabel">
                    Upload File
                </label>

                <input type="file">

            </div>


            <div class="field full">

                <label id="commentLabel">
                    Comment
                </label>

                <textarea placeholder="Write something..."></textarea>

            </div>


            <div class="field full">

                <label>

                    <input type="checkbox">

                    <span id="agreeText">
                        I agree with the terms
                    </span>

                </label>

            </div>

        </div>


        <div class="buttons">

            <button type="submit"
                    class="submit-btn"
                    id="submitButton">

                Submit

            </button>


            <button type="reset"
                    class="reset-btn"
                    id="resetButton">

                Reset

            </button>

        </div>

    </form>

    <script src="lesson.js"></script>

</body>
</html>
