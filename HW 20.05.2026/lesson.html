<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Calendar Generator</title>

    <link rel="stylesheet" href="style.css">

</head>
<body>

    <div class="container">

        <h1>Calendar Generator</h1>


        <div class="inputs">

            <label>

                Month:

                <input type="number"
                       id="monthInput"
                       min="1"
                       max="12"
                       value="8">

            </label>


            <label>

                Year:

                <input type="number"
                       id="yearInput"
                       value="2026">

            </label>

        </div>


        <button id="generateButton">

            Generate

        </button>


        <div id="calendar"></div>

    </div>

    <script src="lesson.js"></script>

</body>
</html>
