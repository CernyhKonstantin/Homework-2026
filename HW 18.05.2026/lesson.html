<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Memory Game</title>

    <link rel="stylesheet" href="style.css">

</head>
<body>

    <div class="game-container">

        <h1>Memory Game</h1>

        <p id="status">
            Find all pairs!
        </p>


        <select id="difficulty">

            <option value="easy">
                Easy
            </option>

            <option value="medium">
                Medium
            </option>

            <option value="hard">
                Hard
            </option>

        </select>


        <div id="gameBoard"></div>


        <button id="restartButton">

            Restart Game

        </button>

    </div>

    <script src="lesson.js"></script>

</body>
</html>
