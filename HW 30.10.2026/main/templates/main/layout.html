{% load static %}
<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Personal CV and professional portfolio.">
<title>{% block title %}Personal CV{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="{% static 'main/style.css' %}" rel="stylesheet"></head><body>
<nav class="navbar navbar-expand-lg navbar-dark fixed-top cv-navbar"><div class="container">
<a class="navbar-brand fw-bold" href="{% url 'main:index' %}"><span class="brand-mark">CV</span> Portfolio</a>
<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#cvNavigation" aria-controls="cvNavigation" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
<div class="collapse navbar-collapse" id="cvNavigation"><ul class="navbar-nav ms-auto align-items-lg-center">
<li class="nav-item"><a class="nav-link" href="#about">About</a></li><li class="nav-item"><a class="nav-link" href="#education">Education</a></li><li class="nav-item"><a class="nav-link" href="#skills">Skills</a></li><li class="nav-item"><a class="nav-link" href="#projects">Projects</a></li>
<li class="nav-item ms-lg-3"><a class="btn btn-sm btn-cv" href="mailto:{{ profile.email }}">Contact me</a></li></ul></div></div></nav>
{% block content %}{% endblock %}
<footer class="footer py-4"><div class="container d-flex flex-column flex-md-row justify-content-between gap-2"><span>© {% now "Y" %} {{ profile.first_name }} {{ profile.last_name }}. All rights reserved.</span><span>Built with Django and Bootstrap 5</span></div></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
