{% load static %}<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>{% block title %}Phone Book{% endblock %}</title><link rel="stylesheet" href="{% static 'main/style.css' %}"></head>
<body><header class="topbar"><div class="nav-wrap"><a class="brand" href="{% url 'contact_list' %}"><span>PHONE</span>BOOK</a><a class="nav-link" href="{% url 'contact_list' %}">All contacts</a><a class="button button-primary" href="{% url 'contact_create' %}">+ Add contact</a></div></header>
<main class="container">{% if messages %}{% for message in messages %}<div class="message">{{ message }}</div>{% endfor %}{% endif %}{% block content %}{% endblock %}</main><footer>Phone Book · Django practice project</footer></body></html>
