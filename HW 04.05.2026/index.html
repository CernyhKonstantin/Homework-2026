<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JS Tasks</title>
</head>
<body>

<h2>JavaScript Tasks (prompt + alert)</h2>
<button onclick="runTasks()">Start Tasks</button>

<script>
function runTasks() {

    // Task 1: Ask name
    let name = prompt("Enter your name:");
    alert("Hello, " + name + "!");

    // Task 2: Show sign of number
    let value = Number(prompt("Enter a number:"));
    if (value > 0) {
        alert("1");
    } else if (value < 0) {
        alert("-1");
    } else {
        alert("0");
    }

    // Task 3: Check official name of JavaScript
    let answer = prompt("What is the official name of JavaScript?");
    if (answer === "ECMAScript") {
        alert("Correct!");
    } else {
        alert("Wrong! The correct answer is ECMAScript.");
    }

    // Task 4: Even or odd
    let num = Number(prompt("Enter a number:"));
    if (num % 2 === 0) {
        alert("Even number");
    } else {
        alert("Odd number");
    }

    // Task 5: Sum of two numbers
    let a = Number(prompt("Enter first number:"));
    let b = Number(prompt("Enter second number:"));
    let sum = a + b;
    alert("Sum: " + sum);
}
</script>

</body>
</html>
