{% extends "base.html" %}{% block title %}Add product · Nova Store{% endblock %}{% block content %}<a class="back" href="{{ url_for('home') }}">← Back to catalog</a><section class="formpanel"><p class="eyebrow">CATALOG MANAGEMENT</p><h1>Add a product</h1><p class="description">Enter product details to add an item to the catalog.</p>{% if error %}<p class="error">{{ error }}</p>{% endif %}<form method="post"><label>Product title<input name="title" required></label><label>Image URL<input name="image" type="url" required placeholder="https://example.com/image.jpg"></label><div class="formrow"><label>Price (USD)<input name="price" type="number" min="0" step="0.01" required></label><label>Rating (0–5)<input name="rating" type="number" min="0" max="5" step="0.1" required></label></div><button class="button" type="submit">Create product →</button></form></section>{% endblock %}
