<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Favorite Meals</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="./css/style.css">

</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">

        <div class="container">

            <a class="navbar-brand"
               href="index.html">

                🍽 Meal Explorer

            </a>

            <div class="ms-auto">

                <a
                    href="index.html"
                    class="btn btn-outline-light me-2">

                    Home

                </a>

                <a
                    href="favorites.html"
                    class="btn btn-warning">

                    Favorites

                </a>

            </div>

        </div>

    </nav>

    <section class="hero-small">

        <div class="container text-center">

            <h1>

                ❤️ Favorite Meals

            </h1>

            <p class="lead">

                Your saved recipes from LocalStorage

            </p>

        </div>

    </section>

    <section class="container py-5">

        <div
            id="favoritesContainer"
            class="row g-4">

        </div>

    </section>

    <section
        id="emptyMessage"
        class="container text-center d-none">

        <h3>

            No favorite meals found

        </h3>

        <p>

            Add meals to favorites from the main page.

        </p>

        <a
            href="index.html"
            class="btn btn-primary">

            Back to Home

        </a>

    </section>

    <script src="./dist/favorites.js"></script>

</body>
</html>
