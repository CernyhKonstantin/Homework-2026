<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Meal Explorer</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="./css/style.css">

</head>
<body>


    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">

        <div class="container">

            <a class="navbar-brand"
               href="index.html">

                🍽 Meal Explorer

            </a>

            <button
                class="navbar-toggler"
                data-bs-toggle="collapse"
                data-bs-target="#navbarMenu">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div
                class="collapse navbar-collapse"
                id="navbarMenu">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">

                        <a class="nav-link active"
                           href="index.html">

                            Home

                        </a>

                    </li>

                    <li class="nav-item">

                        <a class="nav-link"
                           href="favorites.html">

                            Favorites

                        </a>

                    </li>

                </ul>

            </div>

        </div>

    </nav>


    <section class="hero-section">

        <div class="container text-center">

            <h1 class="display-4">

                Meal Explorer

            </h1>

            <p class="lead">

                Search meals, browse categories and save your favorites

            </p>

        </div>

    </section>


    <section class="container py-5">

        <div class="row">

            <div class="col-md-10">

                <input
                    type="text"
                    id="searchInput"
                    class="form-control form-control-lg"
                    placeholder="Search meal...">

            </div>

            <div class="col-md-2">

                <button
                    id="searchButton"
                    class="btn btn-warning btn-lg w-100">

                    Search

                </button>

            </div>

        </div>

    </section>


    <section class="container mb-4">

        <button
            id="randomButton"
            class="btn btn-success">

            🎲 Random Meal

        </button>

    </section>


    <section class="container">

        <h2 class="mb-4">

            Categories

        </h2>

        <div
            id="categoriesContainer"
            class="row g-3">

        </div>

    </section>


    <section class="container py-5">

        <h2 class="mb-4">

            Meals

        </h2>

        <div
            id="mealsContainer"
            class="row g-4">

        </div>

    </section>


    <div
        class="modal fade"
        id="randomMealModal"
        tabindex="-1">

        <div class="modal-dialog modal-lg">

            <div class="modal-content">

                <div class="modal-header">

                    <h5
                        id="randomMealTitle"
                        class="modal-title">

                        Meal

                    </h5>

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal">

                    </button>

                </div>

                <div
                    id="randomMealBody"
                    class="modal-body">

                </div>

            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <script src="./dist/main.js"></script>

</body>
</html>
