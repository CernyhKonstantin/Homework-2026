{% extends "account/base.html" %}{% block content %}<section class="card"><h1>{{ t.settings }}</h1><form method="post">{% csrf_token %}<label>{{ t.theme }}</label><select name="theme"><option value="light" {% if theme == "light" %}selected{% endif %}>{{ t.light }}</option><option value="dark" {% if theme == "dark" %}selected{% endif %}>{{ t.dark }}</option></select><label>{{ t.language }}</label><select name="language"><option value="uk" {% if language_value == "uk" %}selected{% endif %}>{{ t.ukrainian }}</option><option value="en" {% if language_value == "en" %}selected{% endif %}>{{ t.english }}</option></select><button type="submit">{{ t.save_settings }}</button></form></section>{% endblock %}
