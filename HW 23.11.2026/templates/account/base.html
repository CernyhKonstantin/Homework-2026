<!doctype html><html lang="{{ lang }}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ t.title }}</title><style>
:root{--bg:#0b1220;--surface:#142238;--text:#e8f0ff;--muted:#a6bad4;--accent:#52c7ff;--border:#29415e}body.light{--bg:#f2f6fb;--surface:#fff;--text:#1a2b40;--muted:#596c82;--accent:#087bb4;--border:#d5e1ed}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,Arial}header{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap;padding:18px 5%;border-bottom:1px solid var(--border);background:var(--surface)}.brand{font-weight:800;font-size:1.25rem;color:var(--text);text-decoration:none}.brand span{color:var(--accent)}nav{display:flex;gap:15px;flex-wrap:wrap}nav a{color:var(--muted);text-decoration:none}main{width:min(92%,950px);margin:45px auto}.card{background:var(--surface);border:1px solid var(--border);padding:30px;border-radius:18px}h1{margin-top:0;font-size:clamp(28px,5vw,42px)}input,select{display:block;width:100%;margin:8px 0 18px;padding:12px;border:1px solid var(--border);border-radius:9px;background:var(--bg);color:var(--text)}button,.btn{display:inline-block;border:0;background:var(--accent);color:#062133;padding:11px 18px;border-radius:9px;font-weight:700;cursor:pointer;text-decoration:none}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-top:20px}.stat{border:1px solid var(--border);border-radius:12px;padding:16px;background:var(--bg)}.stat small{display:block;color:var(--muted)}.stat strong{display:block;overflow-wrap:anywhere}footer{text-align:center;color:var(--muted);padding:30px}</style></head><body class="{{ theme|default:'dark' }}"><header><a class="brand" href="/">My<span>Account</span></a><nav><a href="/">{{ t.title }}</a><a href="/statistics/">{{ t.stats }}</a><a href="/settings/">{{ t.settings }}</a><a href="/rules/">{{ t.rules }}</a></nav></header><main>{% block content %}{% endblock %}</main><footer>Cookie-based personal dashboard · Django Middleware</footer></body></html>
